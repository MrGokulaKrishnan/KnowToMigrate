name: Build Android App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Release Artifacts
        run: |
          mkdir -p releases/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk releases/android/KnowToMigrate-1.0.0.apk
          sha256sum releases/android/KnowToMigrate-1.0.0.apk > releases/android/KnowToMigrate-1.0.0.apk.sha256
          echo "APK SHA256:"
          cat releases/android/KnowToMigrate-1.0.0.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowToMigrate-Android-Release
          path: |
            releases/android/KnowToMigrate-1.0.0.apk
            releases/android/KnowToMigrate-1.0.0.apk.sha256

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/android/KnowToMigrate-1.0.0.apk
            releases/android/KnowToMigrate-1.0.0.apk.sha256
          generate_release_notes: true
