name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-rust-android:
    name: Build Rust Core (Android)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Build libktm.so
        run: |
          cd core
          cargo ndk -t ${{ matrix.target }} build --release -p ktm-ffi

      - name: Upload libktm.so
        uses: actions/upload-artifact@v4
        with:
          name: libktm-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/libktm.so

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-rust-android
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Rust libs
        uses: actions/download-artifact@v4
        with:
          pattern: libktm-*
          merge-multiple: false

      - name: Copy .so files to jniLibs
        run: |
          mkdir -p apps/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p apps/android/app/src/main/jniLibs/x86_64
          mkdir -p apps/android/app/src/main/jniLibs/armeabi-v7a
          cp libktm-aarch64-linux-android/libktm.so apps/android/app/src/main/jniLibs/arm64-v8a/
          cp libktm-x86_64-linux-android/libktm.so apps/android/app/src/main/jniLibs/x86_64/
          cp libktm-armv7-linux-androideabi/libktm.so apps/android/app/src/main/jniLibs/armeabi-v7a/

      - name: Build Debug APK
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        run: |
          cd apps/android
          ./gradlew assembleRelease

      - name: Compute SHA-256
        run: |
          sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum apps/android/app/build/outputs/apk/release/app-release-unsigned.apk > apps/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KnowToMigrate-Android
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          generate_release_notes: true
