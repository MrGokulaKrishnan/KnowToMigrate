# Release pipeline. Runs on version tags (v*) or manually.
# Builds the signed APK and the Windows installers, generates the website release data
# from those exact binaries, deploys the website, then publishes the GitHub Release.
# Nothing is ever deployed from a branch push, so the site cannot lose its download files.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.KTM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::KTM_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KTM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew test --no-daemon

      - name: Build signed release APK
        working-directory: apps/android
        env:
          KTM_KEYSTORE_PASSWORD: ${{ secrets.KTM_KEYSTORE_PASSWORD }}
          KTM_KEY_ALIAS: ${{ secrets.KTM_KEY_ALIAS }}
          KTM_KEY_PASSWORD: ${{ secrets.KTM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK and checksum
        run: |
          VERSION=$(jq -r .version version.json)
          APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No signed release APK was produced"; exit 1; fi
          mkdir -p artifacts/android
          cp "$APK" "artifacts/android/KnowToMigrate-${VERSION}.apk"
          (cd artifacts/android && sha256sum "KnowToMigrate-${VERSION}.apk" > "KnowToMigrate-${VERSION}.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android/*
          if-no-files-found: error

  windows:
    name: Windows EXE and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build app and updater
        run: |
          dotnet build apps/windows-wpf/KnowToMigrate.csproj -c Release
          dotnet build apps/windows-updater/KnowToMigrate.Updater.csproj -c Release

      - name: Publish self-contained single-file binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows/publish | Out-Null
          dotnet publish apps/windows-wpf/KnowToMigrate.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/windows/publish
          dotnet publish apps/windows-updater/KnowToMigrate.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/windows/publish
          $size = (Get-Item artifacts/windows/publish/KnowToMigrate.exe).Length
          if ($size -lt 20MB) { throw "KnowToMigrate.exe is only $size bytes. A self-contained build should be tens of MB. Refusing to publish." }

      - name: Stage files, MSI and checksums
        shell: pwsh
        run: |
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $out = "artifacts/windows"
          Copy-Item "$out/publish/KnowToMigrate.exe" "$out/KnowToMigrate-$ver-x64.exe" -Force
          Copy-Item "$out/publish/KnowToMigrate.exe" "$out/KnowToMigrate-Setup.exe" -Force
          wix build Package.wxs -arch x64 -o "$out/KnowToMigrate-$ver-x64.msi"
          Get-ChildItem "$out/*.exe","$out/*.msi" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File "$($_.FullName).sha256" -NoNewline
          }
          Remove-Item -Recurse -Force "$out/publish"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/windows/*
          if-no-files-found: error

  site:
    name: Website build and deploy
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install website dependencies
        working-directory: apps/website
        run: npm ci

      - name: Stage binaries for the release generator
        run: |
          mkdir -p apps/website/public/download
          find artifacts/downloaded -type f \( -name 'KnowToMigrate-*.apk' -o -name 'KnowToMigrate-*.exe' -o -name 'KnowToMigrate-*.msi' \) -print0 |
            while IFS= read -r -d '' f; do cp "$f" "apps/website/public/download/$(basename "$f").bin"; done
          ls -la apps/website/public/download

      - name: Generate release data (fails if any binary is missing)
        run: node scripts/release/site-release.mjs

      - name: Build website
        working-directory: apps/website
        run: npm run build

      - name: Check Firebase credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing. Add it under Settings > Secrets and variables > Actions."; exit 1; fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: knowtomigrate
          channelId: live
          entryPoint: .

  publish:
    name: Publish GitHub Release
    needs: [android, windows, site]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/downloaded/**/*
          generate_release_notes: true
