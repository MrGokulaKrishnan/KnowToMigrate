# Runs on every change to the website. Never deploys.
name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type-check, build, and release-version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Install
        working-directory: apps/website
        run: npm ci
      - name: No hardcoded release versions
        run: node scripts/release/site-release.mjs --literals
      - name: Build
        working-directory: apps/website
        run: npm run build

  test-engine:
    name: Transit engine and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test packages
        run: |
          cd packages/protocol-types && npx tsc -p .
          cd ../transit-engine && npx tsc -p .
          node --test dist/tests/*.test.js

  deploy-dev:
    name: Deploy to Firebase preview channel (dev)
    needs: [check, test-engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Install dependencies
        working-directory: apps/website
        run: npm ci
      - name: Build website
        working-directory: apps/website
        run: npm run build
      - name: Deploy to Firebase preview channel 'dev'
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: knowtomigrate
          channelId: dev
          expires: 7d
          entryPoint: .
