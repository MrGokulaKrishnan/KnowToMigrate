# Windows CI on every change: restore and build both projects. Release binaries come from release.yml.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app and updater
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version synchronization
        shell: pwsh
        run: pwsh scripts/check-versions.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: |
          dotnet build apps/windows-wpf/KnowToMigrate.csproj -c Release
          dotnet build apps/windows-updater/KnowToMigrate.Updater.csproj -c Release

  test:
    name: Run integration and stress tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version synchronization
        shell: pwsh
        run: pwsh scripts/check-versions.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run KtmIntegrationTests
        run: dotnet run --project tests/KtmIntegrationTests/KtmIntegrationTests.csproj -c Release
