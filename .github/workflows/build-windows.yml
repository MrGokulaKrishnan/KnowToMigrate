name: Build Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows-app:
    name: Build Windows MSI & EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Restore NuGet packages
        run: dotnet restore apps/windows-wpf/KnowToMigrate.csproj

      - name: Build Windows App
        run: dotnet build apps/windows-wpf/KnowToMigrate.csproj -c Release

      - name: Publish self-contained EXE
        run: |
          dotnet publish apps/windows-wpf/KnowToMigrate.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/windows/

      - name: Stage Release EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/windows
          Copy-Item dist/windows/KnowToMigrate.exe releases/windows/KnowToMigrate-1.0.0-x64.exe -Force

      - name: Build MSI Installer
        run: wix build Package.wxs -o releases/windows/KnowToMigrate-1.0.0-x64.msi

      - name: Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash releases/windows/KnowToMigrate-1.0.0-x64.exe -Algorithm SHA256).Hash
          $msiHash = (Get-FileHash releases/windows/KnowToMigrate-1.0.0-x64.msi -Algorithm SHA256).Hash
          $exeHash | Out-File releases/windows/KnowToMigrate-1.0.0-x64.exe.sha256
          $msiHash | Out-File releases/windows/KnowToMigrate-1.0.0-x64.msi.sha256
          Write-Host "EXE SHA256: $exeHash"
          Write-Host "MSI SHA256: $msiHash"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KnowToMigrate-Windows-Release
          path: |
            releases/windows/KnowToMigrate-1.0.0-x64.exe
            releases/windows/KnowToMigrate-1.0.0-x64.exe.sha256
            releases/windows/KnowToMigrate-1.0.0-x64.msi
            releases/windows/KnowToMigrate-1.0.0-x64.msi.sha256

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/windows/KnowToMigrate-1.0.0-x64.exe
            releases/windows/KnowToMigrate-1.0.0-x64.exe.sha256
            releases/windows/KnowToMigrate-1.0.0-x64.msi
            releases/windows/KnowToMigrate-1.0.0-x64.msi.sha256
          generate_release_notes: true
