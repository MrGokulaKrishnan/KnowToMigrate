[workspace]
members = [
    "ktm-crypto",
    "ktm-protocol",
    "ktm-discovery",
    "ktm-transfer",
    "ktm-migration",
    "ktm-ffi",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["KnowToMigrate Team"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
