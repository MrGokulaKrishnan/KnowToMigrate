[package]
name = "ktm-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
bytes = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex-literal = "0.4"
