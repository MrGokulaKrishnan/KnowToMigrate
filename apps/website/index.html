<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO -->
    <title>KnowToMigrate — Move Anything. Anywhere. Seamlessly.</title>
    <meta name="description" content="KnowToMigrate — Move Anything. Anywhere. Seamlessly. A secure standalone application for cross-platform file sharing and device migration. No cloud. No account. AES-256-GCM encrypted." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://knowtomigrate.web.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="KnowToMigrate — Move Anything. Anywhere. Seamlessly." />
    <meta property="og:description" content="Secure, offline-first file sharing and device migration. No cloud. No account. AES-256-GCM encrypted." />
    <meta property="og:image" content="/logo512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://knowtomigrate.web.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KnowToMigrate — Move Anything. Anywhere. Seamlessly." />
    <meta name="twitter:description" content="Secure offline-first file sharing and device migration. AES-256-GCM encrypted. No cloud." />
    <meta name="twitter:image" content="/logo512.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
